global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "production-rag-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "weaviate"
    static_configs:
      - targets: ["weaviate:2112"]
    scrape_interval: 30s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_interval: 15s
