apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-rag.fullname" . }}-api
  labels:
    {{- include "production-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "production-rag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "production-rag.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace }}
  labels:
    {{- include "production-rag.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "production-rag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
